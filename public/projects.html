<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Projects by Dharani Wasundara – software and web development projects.">
    <title>Projects | Dharani Wasundara</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 2rem;
        }

        .project-card {
            padding: 2.2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .project-type {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--primary-lt);
        }

        .project-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1.35;
        }

        .project-period {
            font-size: 0.8rem;
            color: var(--text-dim);
            font-style: italic;
        }

        .project-desc {
            font-size: 0.93rem;
            color: var(--text-muted);
            line-height: 1.7;
            flex: 1;
        }

        .project-tech {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .project-actions {
            display: flex;
            gap: 0.8rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }

        .project-actions a {
            padding: 0.5rem 1.2rem;
            font-size: 0.85rem;
        }

        .featured-badge {
            display: inline-block;
            padding: 0.2rem 0.7rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* loading state */
        .skeleton {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.04) 25%, rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0.04) 75%);
            background-size: 200%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius-sm);
        }

        @keyframes shimmer {
            from {
                background-position: 200% 0;
            }

            to {
                background-position: -200% 0;
            }
        }
    </style>
</head>

<body>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <main class="page-wrapper">
        <p class="section-label reveal">Portfolio</p>
        <h1 class="section-title reveal">My Projects</h1>
        <p class="section-subtitle reveal">
            A showcase of the projects I've built — from data analysis and visualization tools to responsive web
            applications.
        </p>
        <div class="section-divider"></div>

        <div class="projects-grid" id="projects-grid">
            <!-- skeleton placeholders -->
            <div class="glass-card project-card">
                <div class="skeleton" style="height:16px;width:60%;"></div>
                <div class="skeleton" style="height:24px;width:80%;margin-top:8px;"></div>
                <div class="skeleton" style="height:12px;width:40%;margin-top:4px;"></div>
                <div class="skeleton" style="height:80px;margin-top:8px;"></div>
                <div style="display:flex;gap:8px;margin-top:8px;">
                    <div class="skeleton" style="height:26px;width:60px;border-radius:50px;"></div>
                    <div class="skeleton" style="height:26px;width:70px;border-radius:50px;"></div>
                </div>
            </div>
            <div class="glass-card project-card">
                <div class="skeleton" style="height:16px;width:60%;"></div>
                <div class="skeleton" style="height:24px;width:80%;margin-top:8px;"></div>
                <div class="skeleton" style="height:12px;width:40%;margin-top:4px;"></div>
                <div class="skeleton" style="height:80px;margin-top:8px;"></div>
                <div style="display:flex;gap:8px;margin-top:8px;">
                    <div class="skeleton" style="height:26px;width:60px;border-radius:50px;"></div>
                    <div class="skeleton" style="height:26px;width:70px;border-radius:50px;"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/nav.js"></script>
    <script>
        fetch('/api/projects')
            .then(r => r.json())
            .then(projects => {
                const grid = document.getElementById('projects-grid');
                grid.innerHTML = '';

                if (!projects.length) {
                    grid.innerHTML = '<p style="color:var(--text-muted)">No projects yet. Check back soon!</p>';
                    return;
                }

                projects.forEach((p, i) => {
                    const techBadges = p.technologies.map(t => `<span class="badge">${t}</span>`).join('');
                    const featuredBadge = p.featured ? `<span class="featured-badge">Featured</span>` : '';
                    grid.innerHTML += `
            <div class="glass-card project-card reveal" style="animation-delay:${i * 0.1}s">
              <div style="display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap;">
                <span class="project-type">${p.type}</span>
                ${featuredBadge}
              </div>
              <h2 class="project-title">${p.title}</h2>
              <div class="project-period">${p.period}</div>
              <p class="project-desc">${p.description}</p>
              <div class="project-tech">${techBadges}</div>
              <div class="project-actions">
                <a href="${p.github}" target="_blank" rel="noopener" class="btn btn-outline">⌥ GitHub</a>
              </div>
            </div>`;
                });

                // Re-trigger reveal
                document.querySelectorAll('.reveal:not(.visible)').forEach(el => {
                    const obs = new IntersectionObserver(([e]) => {
                        if (e.isIntersecting) { el.classList.add('visible'); obs.disconnect(); }
                    }, { threshold: 0.1 });
                    obs.observe(el);
                });
            })
            .catch(() => {
                document.getElementById('projects-grid').innerHTML = '<p style="color:var(--text-muted)">Could not load projects. Please try again later.</p>';
            });
    </script>
</body>

</html>
